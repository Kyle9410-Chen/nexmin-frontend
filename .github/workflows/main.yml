name: Frontend Lint, Test, Build, and Image

# Markdown-only changes do not need the Node toolchain.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "10.15.1"
  # Vite inlines this at build time. Without it the bundle builds fine and then
  # throws at load -- src/lib/request/api.ts refuses to import with no base URL.
  # Set the repository variable once a real dev backend URL exists.
  VITE_BACKEND_BASE_URL: ${{ vars.VITE_BACKEND_BASE_URL || 'http://localhost:8080' }}

jobs:
  # Lint and Format are both cheap and independent, so unlike the backend's strictly
  # sequential chain they run in parallel and Test waits on both.
  Lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      # Before setup-node: `cache: pnpm` needs pnpm already on PATH.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

  Format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

  Test:
    needs: [Lint, Format]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No env of its own: vitest runs in mode "test" and .env.test is committed.
      - name: Test
        run: pnpm test:coverage

  Build:
    needs: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm build` is `tsc -b && vite build`, so the typecheck is part of this.
      - name: Build
        run: pnpm build

  Build-Image:
    needs: Build
    # Guarded by a repository variable so the pipeline stays green before the Docker
    # Hub credentials exist. Set DOCKER_IMAGE_ENABLED=true once
    # DOCKER_REGISTRY_USERNAME / DOCKER_REGISTRY_TOKEN are in place.
    if: ${{ vars.DOCKER_IMAGE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: docker-hub
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      # No Node or pnpm setup here: the Dockerfile installs its own toolchain and
      # runs the build in its builder stage.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKER_REGISTRY_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # The base URL is baked into the bundle, so it has to reach the build.
          build-args: |
            VITE_BACKEND_BASE_URL=${{ env.VITE_BACKEND_BASE_URL }}
          tags: |
            ${{ vars.DOCKER_IMAGE || 'umineko9410/nexmin-frontend' }}:dev
            ${{ vars.DOCKER_IMAGE || 'umineko9410/nexmin-frontend' }}:${{ github.sha }}
